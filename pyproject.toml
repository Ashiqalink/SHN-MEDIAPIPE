[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixorra"
version = "0.1.0"
description = "Local, schema-driven game JSON authoring core"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5"]

[project.scripts]
pixorra = "core.__main__:main"

[tool.setuptools]
packages = ["core", "server"]
